  max_candidates_for_ranking: 3
  enable_clarification_prompt: true

domains:
  - name: "일반대학원"
    domain_id: "general_grad"
    urls:
      - "https://grad.ssu.ac.kr/"
    aliases: ["숭실 일반대학원", "Graduate School", "대학원 본부", "grad", "일반대"]
    
    description: "숭실대학교 일반대학원은 석사·박사 학위 과정을 운영하며, 전일제 학생 중심의 학사 행정, 논문 심사, 연구 과제, 장학금, BK21 등을 관장하는 메인 대학원입니다."
    
    importance_weight: 0.95
    freshness_weight: 0.85
    is_default_fallback: true
    
    specialization:
      type: "general"
      scope: "전체 학사 행정 및 학위 과정 (석사·박사·석박사통합)"
      target_audience: ["일반대학원생", "전일제 석박사", "연구 중심 학생", "전 구성원"]
      
